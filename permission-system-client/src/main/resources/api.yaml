    "/api/v1/permission/delete/{uuid}/mode/{mode}": {
      "delete": {
        "tags": [
          "permission-controller"
        ],
        "summary": "Delete permission.",
        "description": "This endpoint is used to delete a permission. There are 3 different modes: Shallow simply deletes the permission, at the risk of ripping a whole in the permission tree.Intelligent fixes that hole, by connecting all children of the deleted permission to the deleted permissions parent. Recursive also deletes all sub-permissions.",
        "operationId": "deletePermission",
        "parameters": [
          {
            "name": "uuid",
            "in": "path",
            "description": "The UUID of the permission",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          },
          {
            "name": "mode",
            "in": "path",
            "description": "The mode used for deleting the permission.",
            "required": true,
            "schema": {
              "type": "string",
              "enum": [
                "SHALLOW",
                "INTELLIGENT",
                "RECURSIVE"
              ]
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Permission deleted successfully.",
            "content": {
              "*/*": {
                "schema": {
                  "uniqueItems": true,
                  "type": "array",
                  "items": {
                    "type": "string",
                    "format": "uuid"
                  }
                }
